<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Informático</title>
        <style>
        .cabecera {
            text-align: center;
            margin-top: 30px;
        }

        .cabecera h1 {
            font-size: 36px;
            color: #2c3e50;
        }

        .cabecera p {
            font-size: 18px;
            color: #7f8c8d;
        }
        
        .contenedor-campos {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        
        .campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .campo label {
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #34495e;
        }

        .campo input {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .campo input:focus {
            outline: none;
            border-color: #2c80ff;
            box-shadow: 0 0 0 3px rgba(44, 128, 255, 0.15);
        }
        
        .campo textarea {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }

        .campo textarea:focus {
            outline: none;
            border-color: #2c80ff;
            box-shadow: 0 0 0 3px rgba(44, 128, 255, 0.15);
        }
    </style>
</head>
<body>
        <div class="cabecera">
            <h1>Panel de Soporte Técnico</h1>
            <p>Registro y control de incidencias</p>
        </div>
        <form class="formulario-averia">
            <div class="contenedor-campos">
                <div class="campo">
                    <label for="dispositivo">Dispositivo averiado</label>
                                    <input type="text" id="dispositivo" name="dispositivo" required placeholder="Ej: Portátil Lenovo, Torre custom...">
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción del problema técnico</label>
                    <textarea id="descripcion" name="descripcion" required placeholder="Ej: No enciende, la pantalla parpadea, hace un ruido extraño al arrancar..."></textarea>
                </div>
            </div>
        </form>
</body>
</html>
