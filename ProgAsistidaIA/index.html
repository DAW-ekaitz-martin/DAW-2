<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Informático</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
                background-color: #1e1e1e;
                color: #e0e0e0;
                line-height: 1.5;
            }
            .cabecera {
                text-align: center;
                margin-top: 30px;
            }

            .cabecera h1 {
                font-size: 36px;
                color: #ffffff;
            }

            .cabecera p {
                font-size: 18px;
                color: #7f8c8d;
            }
            
            .contenedor-campos {
                max-width: 500px;
                margin: 30px auto;
                padding: 20px;
                border: 1px solid #444;
                border-radius: 8px;
                background-color: #2a2a2a;
            }
            
            .campo {
                display: flex;
                flex-direction: column;
                margin-bottom: 18px;
            }

            .campo label {
                margin-bottom: 6px;
                font-size: 14px;
                font-weight: bold;
                color: #cfd8dc;
            }

            .campo input {
                padding: 10px;
                font-size: 15px;
                border: 1px solid #555;
                border-radius: 5px;
                box-sizing: border-box;
                background-color: #3a3a3a;
                color: #e0e0e0;
            }

            .campo input:focus {
                outline: none;
                border-color: #2c80ff;
                box-shadow: 0 0 0 3px rgba(44, 128, 255, 0.15);
            }
            
            .campo textarea {
                padding: 10px;
                font-size: 15px;
                border: 1px solid #555;
                border-radius: 5px;
                box-sizing: border-box;
                font-family: inherit;
                resize: vertical;
                min-height: 80px;
                background-color: #3a3a3a;
                color: #e0e0e0;
            }

            .campo textarea:focus {
                outline: none;
                border-color: #2c80ff;
                box-shadow: 0 0 0 3px rgba(44, 128, 255, 0.15);
            }

            .campo select {
                padding: 10px;
                font-size: 15px;
                border: 1px solid #555;
                border-radius: 5px;
                box-sizing: border-box;
                font-family: inherit;
                background-color: #3a3a3a;
                color: #e0e0e0;
            }

            .campo select:focus {
                outline: none;
                border-color: #2c80ff;
                box-shadow: 0 0 0 3px rgba(44, 128, 255, 0.15);
            }

            .btn-enviar {
                display: block;
                width: 100%;
                padding: 12px;
                margin-top: 10px;
                font-size: 16px;
                font-weight: bold;
                color: #fff;
                background-color: #2c80ff;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            .btn-enviar:hover {
                background-color: #1a6ce0;
            }

            .titulo-seccion {
                text-align: center;
                font-size: 24px;
                color: #ffffff;
                margin-top: 40px;
                margin-bottom: 20px;
            }

            .aviso-vacio {
                text-align: center;
                font-size: 15px;
                color: #7f8c8d;
            }

            .contador-incidencias {
                text-align: center;
                font-size: 16px;
                font-weight: bold;
                color: #2c80ff;
                margin-bottom: 10px;
            }

            .tabla-averias {
                display: none;
                width: 90%;
                max-width: 900px;
                margin: 0 auto 40px auto;
                border-collapse: collapse;
                font-size: 15px;
            }

            .tabla-averias th,
            .tabla-averias td {
                border: 1px solid #444;
                padding: 10px;
                text-align: left;
            }

            .tabla-averias th {
                background-color: #2c3e50;
                color: #fff;
                font-weight: bold;
            }

            .tabla-averias tbody tr:nth-child(even) {
                background-color: #2a2a2a;
            }

            .pie-pagina {
                text-align: center;
                font-size: 13px;
                color: #9e9e9e;
                padding: 20px 0;
                border-top: 1px solid #444;
            }
            .btn-tema {
                display: block;
                margin: 15px auto 0 auto;
                padding: 8px 16px;
                font-size: 14px;
                font-weight: bold;
                background-color: #2a2a2a;
                color: #e0e0e0;
                border: 1px solid #555;
                border-radius: 5px;
                cursor: pointer;
            }

            .btn-tema:hover {
                background-color: #3a3a3a;
            }
            body.modo-claro {
                background-color: #ffffff;
                color: #333;
            }

            body.modo-claro .cabecera h1 {
                color: #2c3e50;
            }

            body.modo-claro .contenedor-campos {
                background-color: #f9f9f9;
                border-color: #dcdcdc;
            }

            body.modo-claro .campo label {
                color: #34495e;
            }

            body.modo-claro .campo input,
            body.modo-claro .campo textarea,
            body.modo-claro .campo select {
                background-color: #ffffff;
                color: #333;
                border-color: #ccc;
            }

            body.modo-claro .titulo-seccion {
                color: #2c3e50;
            }

            body.modo-claro .tabla-averias th,
            body.modo-claro .tabla-averias td {
                border-color: #dcdcdc;
            }

            body.modo-claro .tabla-averias tbody tr:nth-child(even) {
                background-color: #f9f9f9;
            }

            body.modo-claro .pie-pagina {
                color: #7f8c8d;
                border-top-color: #dcdcdc;
            }
    </style>
</head>
<body>
        <button id="btn-tema" class="btn-tema">Modo claro</button>
        <div class="cabecera">
            <h1>Panel de Soporte Técnico</h1>
            <p>Registro y control de incidencias</p>
        </div>
        <form class="formulario-averia">
            <div class="contenedor-campos">
                <div class="campo">
                    <label for="dispositivo">Dispositivo averiado</label>
                                    <input type="text" id="dispositivo" name="dispositivo" required placeholder="Ej: Portátil Lenovo, Torre custom...">
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción del problema técnico</label>
                    <textarea id="descripcion" name="descripcion" required placeholder="Ej: No enciende, la pantalla parpadea, hace un ruido extraño al arrancar..."></textarea>
                </div>

                <div class="campo">
                    <label for="urgencia">Grado de urgencia</label>
                    <select id="urgencia" name="urgencia" required>
                        <option value="" disabled selected>Selecciona una opción</option>
                        <option value="baja">Baja</option>
                        <option value="media">Media</option>
                        <option value="urgente">Urgente</option>
                    </select>
                </div>
                <button type="submit" class="btn-enviar">Registrar Incidencia</button>
            </div>
        </form>
        <h2 class="titulo-seccion">Equipos pendientes de reparación</h2>
        <p id="contador-incidencias" class="contador-incidencias">Total de incidencias activas: 0</p>
        <p id="mensaje-vacio" class="aviso-vacio">No hay averías registradas actualmente en el taller</p>
        <table id="tabla-averias" class="tabla-averias">
            <thead>
                <tr>
                    <th>Dispositivo</th>
                    <th>Avería</th>
                    <th>Urgencia</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
        <footer class="pie-pagina">
            <p>Sistema de Control Técnico - Desarrollado por Ekaitz Martin</p>
        </footer>
        <script>
            const botonTema = document.getElementById('btn-tema');

            botonTema.addEventListener('click', function () {
                document.body.classList.toggle('modo-claro');

                if (document.body.classList.contains('modo-claro')) {
                    botonTema.textContent = 'Modo oscuro';
                } else {
                    botonTema.textContent = 'Modo claro';
                }
            });
        </script>
</body>
</html>
